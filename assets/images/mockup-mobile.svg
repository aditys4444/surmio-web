<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F101E"/>
      <stop offset="40%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#08080E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="albumCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#8B5CF6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Phone Body / Bezel -->
  <rect x="10" y="10" width="380" height="800" rx="46" fill="#090A10" stroke="url(#phoneFrameGrad)" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Screen Area -->
  <rect x="22" y="22" width="356" height="776" rx="38" fill="url(#screenBg)"/>
  
  <!-- Dynamic Island / Speaker notch -->
  <rect x="135" y="32" width="130" height="26" rx="13" fill="#000000"/>
  <circle cx="245" cy="45" r="4.5" fill="#1E293B"/>

  <!-- Top Status Bar -->
  <text x="50" y="50" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">09:41</text>
  <path d="M 320 42 L 325 47 L 335 37" stroke="#94A3B8" stroke-width="1.8" fill="none"/>
  <rect x="340" y="40" width="20" height="10" rx="3" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="342" y="42" width="13" height="6" rx="1.5" fill="#38BDF8"/>

  <!-- In-App Header -->
  <g transform="translate(40, 75)">
    <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.06)"/>
    <path d="M 19 10 L 13 16 L 19 22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="160" y="14" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle">PLAYING FROM LIBRARY</text>
    <text x="160" y="27" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Audiophile Master Collection</text>
    
    <circle cx="304" cy="16" r="16" fill="rgba(255,255,255,0.06)"/>
    <circle cx="300" cy="16" r="1.8" fill="#FFF"/>
    <circle cx="304" cy="16" r="1.8" fill="#FFF"/>
    <circle cx="308" cy="16" r="1.8" fill="#FFF"/>
  </g>

  <!-- Album Artwork Frame -->
  <g transform="translate(50, 130)">
    <rect width="300" height="300" rx="24" fill="url(#albumCoverGrad)"/>
    
    <!-- Stylized waves on album -->
    <circle cx="150" cy="150" r="90" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="150" cy="150" r="55" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="150" cy="150" r="28" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="150" cy="150" r="10" fill="#090A10"/>

    <!-- Lossless Audio Format Tag -->
    <rect x="20" y="20" width="110" height="26" rx="8" fill="rgba(0,0,0,0.65)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="34" cy="33" r="4" fill="#10B981"/>
    <text x="44" y="37" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">FLAC 24-BIT</text>
    
    <!-- Sample Rate Badge -->
    <rect x="200" y="20" width="80" height="26" rx="8" fill="rgba(0,0,0,0.65)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="240" y="37" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">192 kHz</text>
  </g>

  <!-- Track Title & Heart -->
  <g transform="translate(50, 460)">
    <text x="0" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Midnight Resonance</text>
    <text x="0" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Aura Soundscapes</text>
    
    <!-- Red glowing Heart / Favorite -->
    <path d="M 285 22 C 285 14, 274 8, 265 16 C 256 8, 245 14, 245 22 C 245 32, 265 42, 265 42 C 265 42, 285 32, 285 22 Z" fill="#EF4444"/>
    <circle cx="215" cy="22" r="14" fill="rgba(255,255,255,0.06)"/>
    <text x="215" y="26" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">EQ</text>
  </g>

  <!-- Interactive Waveform Progress Bar -->
  <g transform="translate(50, 525)">
    <!-- Simulated mini sound wave scrub track -->
    <path d="M 0 10 L 300 10" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 10 L 175 10" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="175" cy="10" r="7" fill="#FFFFFF" filter="url(#shadow)"/>
    
    <!-- Time stamps -->
    <text x="0" y="28" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" font-weight="600">02:14</text>
    <text x="300" y="28" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">-01:28</text>
  </g>

  <!-- Playback Controls -->
  <g transform="translate(50, 580)">
    <!-- Shuffle -->
    <path d="M 10 30 L 25 18 L 38 18 M 10 18 L 25 30 L 38 30" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="24" cy="40" r="2" fill="#8B5CF6"/>

    <!-- Prev Track -->
    <path d="M 85 16 L 85 34 M 100 16 L 86 25 L 100 34 Z" fill="#E2E8F0"/>
    
    <!-- Big Play/Pause Button with Neon Gradient -->
    <circle cx="150" cy="25" r="32" fill="url(#accentGrad)" filter="url(#shadow)"/>
    <!-- Pause icon -->
    <rect x="142" y="15" width="5" height="20" rx="2" fill="#FFFFFF"/>
    <rect x="153" y="15" width="5" height="20" rx="2" fill="#FFFFFF"/>

    <!-- Next Track -->
    <path d="M 215 16 L 215 34 M 200 16 L 214 25 L 200 34 Z" fill="#E2E8F0"/>

    <!-- Repeat -->
    <path d="M 265 18 A 9 9 0 1 1 262 28 M 260 14 L 265 18 L 260 22" stroke="#64748B" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Bottom Drawer Preview (Lyrics Snippet) -->
  <g transform="translate(45, 665)">
    <rect width="310" height="85" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <text x="20" y="24" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">SYNCHRONIZED LYRICS</text>
    <text x="20" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">"Feel every subtle vibration in the air"</text>
    <text x="20" y="66" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">"Pure uncompressed sound everywhere..."</text>
    
    <circle cx="285" cy="42" r="14" fill="rgba(139, 92, 246, 0.2)"/>
    <path d="M 281 38 L 289 42 L 281 46 Z" fill="#A855F7"/>
  </g>

  <!-- Home Indicator Bar -->
  <rect x="135" y="780" width="130" height="4" rx="2" fill="#64748B"/>
</svg>

