<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
  <defs>
    <linearGradient id="deskFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="deskAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="deskShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#8B5CF6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Desktop App Window Frame -->
  <rect x="15" y="15" width="870" height="550" rx="16" fill="#0A0B14" stroke="#334155" stroke-width="2" filter="url(#deskShadow)"/>

  <!-- Title bar / Window controls -->
  <rect x="15" y="15" width="870" height="42" rx="16" fill="#111322"/>
  <rect x="15" y="45" width="870" height="12" fill="#111322"/>
  <circle cx="42" cy="36" r="6" fill="#EF4444"/>
  <circle cx="62" cy="36" r="6" fill="#F59E0B"/>
  <circle cx="82" cy="36" r="6" fill="#10B981"/>

  <text x="450" y="40" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Surmio Lossless Audio Engine • 32-bit / 384kHz Bit-Perfect Direct</text>

  <!-- Left Sidebar (Navigation & Playlists) -->
  <rect x="15" y="57" width="220" height="420" fill="#0E101B" stroke="#1E293B" stroke-width="1"/>
  
  <g transform="translate(35, 80)">
    <!-- App Logo icon -->
    <rect width="28" height="28" rx="8" fill="url(#deskAccent)"/>
    <text x="38" y="20" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Surmio</text>
    <text x="96" y="20" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">PRO</text>
  </g>

  <!-- Sidebar Nav Links -->
  <g transform="translate(35, 135)">
    <!-- Active Nav item -->
    <rect x="-8" y="-6" width="180" height="34" rx="8" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
    <circle cx="8" cy="11" r="5" fill="#8B5CF6"/>
    <text x="24" y="15" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Now Playing</text>

    <text x="24" y="55" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Lossless Library</text>
    <text x="24" y="90" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Hi-Res Albums</text>
    <text x="24" y="125" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Artists &amp; Composers</text>
    <text x="24" y="160" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Folder Browser (NAS)</text>
    <text x="24" y="195" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">10-Band Studio EQ</text>
    
    <!-- Divider -->
    <line x1="-8" y1="220" x2="170" y2="220" stroke="#1E293B"/>
    <text x="0" y="245" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">PLAYLISTS (SMART)</text>
    <text x="24" y="275" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Audiophile Reference FLAC</text>
    <text x="24" y="305" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Midnight Synth &amp; Bass</text>
    <text x="24" y="335" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">DSD Acoustic Master</text>
  </g>

  <!-- Main Center Work Area -->
  <g transform="translate(255, 75)">
    <!-- Top Search & Device Selector -->
    <rect width="360" height="36" rx="10" fill="#141728" stroke="#1E293B" stroke-width="1"/>
    <text x="35" y="23" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">Search 42,800 lossless tracks, artists, or frequencies...</text>
    <circle cx="20" cy="18" r="6" fill="none" stroke="#64748B" stroke-width="1.5"/>

    <!-- DAC Status pill -->
    <rect x="420" y="0" width="190" height="36" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1"/>
    <circle cx="438" cy="18" r="4" fill="#10B981"/>
    <text x="450" y="22" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DAC: FiiO K9 Pro (DSD512)</text>

    <!-- Center Stage: Playing Hero Box -->
    <g transform="translate(0, 55)">
      <rect width="610" height="190" rx="16" fill="linear-gradient(135deg, #1A1838 0%, #101528 100%)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
      
      <!-- Album art mini-card -->
      <rect x="20" y="20" width="150" height="150" rx="14" fill="url(#deskAccent)"/>
      <circle cx="95" cy="95" r="45" fill="#0B0D18"/>
      <circle cx="95" cy="95" r="18" fill="url(#deskAccent)"/>
      
      <!-- Meta details -->
      <text x="190" y="50" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">NOW DECODING (BIT-PERFECT)</text>
      <text x="190" y="80" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Midnight Resonance (Lossless Master)</text>
      <text x="190" y="105" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Aura Soundscapes — Album: Lossless Horizons [2024]</text>
      
      <rect x="190" y="125" width="105" height="24" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="242" y="141" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">FLAC 24B / 192kHz</text>

      <rect x="305" y="125" width="95" height="24" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
      <text x="352" y="141" fill="#10B981" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">BITRATE: 4.6 Mbps</text>
    </g>

    <!-- Up Next Queue / Spectrum visualizer row -->
    <g transform="translate(0, 265)">
      <text x="0" y="16" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Upcoming Queue (Gapless Playback)</text>
      
      <!-- Track row 1 -->
      <rect x="0" y="26" width="610" height="42" rx="8" fill="#131525"/>
      <text x="15" y="52" fill="#8B5CF6" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1</text>
      <text x="35" y="52" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Cybernetic Velvet</text>
      <text x="240" y="52" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">Kuroshio Collective</text>
      <text x="430" y="52" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DSD256</text>
      <text x="560" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">04:15</text>

      <!-- Track row 2 -->
      <rect x="0" y="74" width="610" height="42" rx="8" fill="#0F1120"/>
      <text x="15" y="100" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">2</text>
      <text x="35" y="100" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Celestial Drift</text>
      <text x="240" y="100" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">Solaria &amp; The Orbit</text>
      <text x="430" y="100" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ALAC 24b</text>
      <text x="560" y="100" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">03:18</text>
    </g>
  </g>

  <!-- Bottom Player Bar (Persistent Glass Control Bar) -->
  <rect x="15" y="475" width="870" height="90" rx="16" fill="#131527" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Left mini-track info -->
  <g transform="translate(35, 495)">
    <rect width="50" height="50" rx="8" fill="url(#deskAccent)"/>
    <text x="65" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Midnight Resonance</text>
    <text x="65" y="40" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Aura Soundscapes • 24-bit/192kHz</text>
  </g>

  <!-- Center Player Controls & Waveform -->
  <g transform="translate(330, 488)">
    <!-- Controls row -->
    <path d="M 80 18 L 80 32 M 95 18 L 82 25 L 95 32 Z" fill="#94A3B8"/>
    <circle cx="125" cy="25" r="18" fill="url(#deskAccent)"/>
    <rect x="120" y="19" width="3.5" height="12" rx="1" fill="#FFFFFF"/>
    <rect x="127" y="19" width="3.5" height="12" rx="1" fill="#FFFFFF"/>
    <path d="M 170 18 L 170 32 M 155 18 L 168 25 L 155 32 Z" fill="#94A3B8"/>

    <!-- Progress bar -->
    <text x="-35" y="55" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">02:14</text>
    <path d="M 0 52 L 250 52" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 52 L 140 52" stroke="url(#deskAccent)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="140" cy="52" r="5" fill="#FFFFFF"/>
    <text x="260" y="55" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">03:42</text>
  </g>

  <!-- Right Volume & EQ controls -->
  <g transform="translate(730, 510)">
    <circle cx="10" cy="12" r="12" fill="rgba(139, 92, 246, 0.2)"/>
    <text x="10" y="16" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">EQ</text>
    
    <path d="M 40 8 L 46 8 L 52 4 L 52 20 L 46 16 L 40 16 Z" fill="#94A3B8"/>
    <path d="M 60 12 L 120 12" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <path d="M 60 12 L 105 12" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="105" cy="12" r="4" fill="#FFFFFF"/>
  </g>
</svg>

