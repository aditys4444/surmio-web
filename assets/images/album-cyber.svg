<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="85%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#cyberBg)"/>
  
  <!-- Cyber isometric grid & sound lines -->
  <g stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.2">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
  </g>

  <!-- Glowing vinyl center disc -->
  <circle cx="250" cy="220" r="120" fill="#06121E" stroke="#10B981" stroke-width="3"/>
  <circle cx="250" cy="220" r="85" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" stroke-dasharray="12 8"/>
  <circle cx="250" cy="220" r="45" fill="url(#cyberNeon)"/>
  <circle cx="250" cy="220" r="14" fill="#020617"/>

  <!-- Badge -->
  <rect x="40" y="40" width="75" height="24" rx="6" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1"/>
  <text x="77" y="56" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">DSD 256</text>

  <text x="250" y="415" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="3" text-anchor="middle">CYBERNETIC VELVET</text>
  <text x="250" y="445" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="2" text-anchor="middle">KUROSHIO COLLECTIVE</text>
</svg>

